name: Prepare Cayley 555 assets

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cayley555-assets.yml
  workflow_dispatch:

concurrency:
  group: cayley555-assets
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stop-duplicates:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Asset bundles have already been downloaded; duplicate packaging runs are disabled."
